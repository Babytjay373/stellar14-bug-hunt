name: Docs

# Docs only PRs (Content Crew, glossary, attendees wall) get one quick green check.
on:
  pull_request:
    paths: ["**.md", "attendees/**"]

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No leftover merge markers
        run: |
          if grep -rnE '^(<<<<<<<|>>>>>>>)' --include='*.md' .; then
            echo "Found merge conflict markers. Remove them and push again."
            exit 1
          fi
          echo "Docs look good. Thank you for your first PR!"
