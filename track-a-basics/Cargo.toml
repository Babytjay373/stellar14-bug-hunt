[package]
name = "wallet-basics"
version = "0.1.0"
edition = "2021"
description = "Stellar 14 bug hunt, Track A: Rust basics with a small Stellar flavoured wallet."
license = "MIT"
publish = false

# Bugs 01 to 06 stop the code from compiling, so each one lives behind its own feature.
# That way one compile error never blocks the rest of the room.
# Build one of them with:  cargo test -p wallet-basics --features bug01 bug01
[features]
bug01 = []
bug02 = []
bug03 = []
bug04 = []
bug05 = []
bug06 = []

