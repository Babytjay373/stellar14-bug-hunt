[package]
name = "tip-jar"
version = "0.1.0"
edition = "2021"
description = "Stellar 14 bug hunt, Track B: a tiny Soroban tip jar with planted bugs."
license = "MIT"
publish = false

# Track B is its own workspace, so Track A never downloads soroban-sdk.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
